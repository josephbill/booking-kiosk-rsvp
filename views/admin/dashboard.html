<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Dashboard – Admin</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
<style>
  /* Skeleton shimmer for cards */
  .skeleton {
    display: inline-block;
    height: 1em;
    border-radius: 4px;
    background: linear-gradient(90deg, #e9ecef 25%, #f4f5f7 50%, #e9ecef 75%);
    background-size: 200% 100%;
    animation: shimmer 1.2s infinite;
  }
  @keyframes shimmer {
    0%   { background-position: 200% 0; }
    100% { background-position: -200% 0; }
  }

  /* Value swap fade */
  .stat-value { transition: opacity .15s ease-in-out; }
  .stat-value.is-loading { opacity: .35; }

  /* Full-page overlay */
  .page-overlay {
    position: fixed; inset: 0;
    background: rgba(255,255,255,.72);
    backdrop-filter: blur(1px);
    display: flex; align-items: center; justify-content: center;
    z-index: 2000;
    opacity: 0; pointer-events: none;
    transition: opacity .15s ease-in-out;
  }
  .page-overlay.active { opacity: 1; pointer-events: auto; }

  /* Small pulse on stat cards while refreshing */
  .card.is-loading { opacity: .55; transition: opacity .15s; }

  /* Metric card layout */
  .metric-card .metric-label {
    font-size: .78rem;
    text-transform: uppercase;
    letter-spacing: .04em;
    color: #6c757d;
    font-weight: 600;
  }
  .metric-card .metric-value {
    font-size: 1.9rem;
    font-weight: 700;
    line-height: 1.1;
    margin-top: .25rem;
  }
  .metric-card .metric-sub {
    font-size: .75rem;
    color: #6c757d;
    margin-top: .25rem;
  }
  .metric-card .metric-icon {
    position: absolute;
    top: .75rem; right: .9rem;
    font-size: 1.35rem;
    opacity: .25;
  }
</style>
</head>
<body class="bg-light">
<nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
  <div class="container-fluid">
    <a class="navbar-brand" href="/admin/dashboard">RSVP Admin</a>
    <div class="navbar-nav">
      <a class="nav-link active" href="/admin/dashboard">Dashboard</a>
      <a class="nav-link" href="/admin/invitations">Invitations</a>
      <a class="nav-link" href="/admin/attendance">Attendance</a>
      <a class="nav-link" href="/admin/scanner/">Scanner</a>
      <a class="nav-link" href="#" id="logoutLink">Logout</a>
    </div>
  </div>
</nav>

<div class="container pb-5">
  <div class="d-flex justify-content-between align-items-center mb-3">
    <h1 class="h3 mb-0">Dashboard</h1>
    <div class="d-flex gap-2 align-items-center">
      <span class="text-muted small" id="meta"></span>
      <button class="btn btn-outline-secondary btn-sm" id="reloadBtn" title="Refresh">
        <i class="bi bi-arrow-clockwise"></i> Refresh
      </button>
    </div>
  </div>

  <!-- Error banner -->
  <div id="errorBanner" class="alert alert-danger d-none d-flex justify-content-between align-items-center">
    <span id="errorText">Something went wrong.</span>
    <button class="btn btn-sm btn-outline-danger" id="retryBtn">Retry</button>
  </div>

  <!-- Stat cards -->
  <div class="row g-3" id="cards"></div>
</div>

<!-- Full-page overlay -->
<div class="page-overlay" id="pageOverlay" aria-hidden="true">
  <div class="text-center">
    <div class="spinner-border text-primary" role="status"></div>
    <div class="mt-2 small text-muted" id="overlayText">Loading…</div>
  </div>
</div>

<script>
/* ---------- Utilities ---------- */
function esc(s) {
  return String(s ?? '').replace(/[&<>"']/g, c => ({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
  }[c]));
}
function fmt(n) {
  if (n === null || n === undefined) return '0';
  return Number(n).toLocaleString();
}

const overlay = document.getElementById('pageOverlay');
const overlayText = document.getElementById('overlayText');
function showOverlay(text = 'Loading…') {
  overlayText.textContent = text;
  overlay.classList.add('active');
  overlay.setAttribute('aria-hidden', 'false');
}
function hideOverlay() {
  overlay.classList.remove('active');
  overlay.setAttribute('aria-hidden', 'true');
}

const cardsEl = document.getElementById('cards');
const metaEl = document.getElementById('meta');
const errorBanner = document.getElementById('errorBanner');
const errorText = document.getElementById('errorText');
function showError(msg) { errorText.textContent = msg; errorBanner.classList.remove('d-none'); }
function hideError() { errorBanner.classList.add('d-none'); }

/* ---------- Card definitions ---------- */
const CARD_DEFS = [
  { key: 'total_invitations', label: 'Total Invitations', color: 'primary', icon: 'bi-envelope-paper' },
  { key: 'total_accepted',    label: 'Accepted',          color: 'success', icon: 'bi-check-circle' },
  { key: 'total_declined',    label: 'Declined',          color: 'danger',  icon: 'bi-x-circle' },
  { key: 'total_pending',     label: 'Pending',           color: 'warning', icon: 'bi-hourglass-split' },
  { key: 'expected_attendees',label: 'Expected Attendees',color: 'info',    icon: 'bi-people' },
  { key: 'checked_in_parties',label: 'Checked-In Parties',color: 'success', icon: 'bi-door-open' },
  { key: 'actual_attendees',  label: 'Actual Attendees',  color: 'success', icon: 'bi-person-check' },
  { key: 'failed_emails',     label: 'Failed Emails',     color: 'secondary', icon: 'bi-envelope-exclamation' },
];

/* ---------- Skeleton renderer ---------- */
function renderSkeletons() {
  cardsEl.innerHTML = CARD_DEFS.map(() => `
    <div class="col-6 col-md-3">
      <div class="card metric-card h-100 border-0 shadow-sm position-relative">
        <div class="card-body">
          <div class="metric-label"><span class="skeleton" style="width:60%"></span></div>
          <div class="metric-value"><span class="skeleton" style="width:40%;height:2rem"></span></div>
          <div class="metric-sub"><span class="skeleton" style="width:50%"></span></div>
        </div>
      </div>
    </div>`).join('');
}

/* ---------- Real card renderer ---------- */
function renderCards(s) {
  cardsEl.innerHTML = CARD_DEFS.map(def => {
    const value = s[def.key] ?? 0;
    const sub = subLabelFor(def.key, s);
    return `
      <div class="col-6 col-md-3">
        <div class="card metric-card h-100 border-${def.color} border-start border-4 shadow-sm position-relative">
          <i class="bi ${def.icon} metric-icon"></i>
          <div class="card-body">
            <div class="metric-label">${esc(def.label)}</div>
            <div class="metric-value stat-value">${fmt(value)}</div>
            ${sub ? `<div class="metric-sub">${sub}</div>` : ''}
          </div>
        </div>
      </div>`;
  }).join('');
}

/* Contextual sub-labels driven by data */
function subLabelFor(key, s) {
  const accepted = Number(s.total_accepted || 0);
  const expected = Number(s.expected_attendees || 0);
  const parties = Number(s.checked_in_parties || 0);
  const actual = Number(s.actual_attendees || 0);
  const total = Number(s.total_invitations || 0);
  switch (key) {
    case 'total_invitations':
      return total > 0 ? `${total} invitation${total === 1 ? '' : 's'} on file` : 'No invitations yet';
    case 'total_accepted':
      return expected > 0 ? `≈ ${expected} expected guests` : 'No confirmed parties';
    case 'expected_attendees':
      return accepted > 0 ? `Across ${accepted} confirmed part${accepted === 1 ? 'y' : 'ies'}` : '—';
    case 'checked_in_parties':
      return expected > 0
        ? `${Math.round((parties / Math.max(accepted, 1)) * 100)}% of confirmed parties`
        : 'No check-ins yet';
    case 'actual_attendees':
      return parties > 0 ? `Avg ${(actual / parties).toFixed(1)} per party` : '—';
    case 'failed_emails':
      return Number(s.failed_emails) > 0 ? 'Retry from Invitations page' : 'All emails delivered';
    default:
      return '';
  }
}

/* ---------- Main loader ---------- */
let inflight = null;

async function loadSummary({ silent = false } = {}) {
  if (inflight) { try { inflight.abort(); } catch (_) {} }
  const controller = new AbortController();
  inflight = controller;

  hideError();

  const hasCards = cardsEl.querySelector('.metric-value');
  if (!silent) {
    if (hasCards) {
      cardsEl.querySelectorAll('.card').forEach(c => c.classList.add('is-loading'));
    } else {
      renderSkeletons();
    }
  }

  try {
    const res = await fetch('/admin/api/summary', {
      signal: controller.signal,
      headers: { 'Accept': 'application/json' },
    });

    if (res.status === 401) {
      showOverlay('Session expired — redirecting to login…');
      window.location.href = '/auth/login';
      return;
    }

    if (!res.ok) throw new Error(`Server returned ${res.status}`);

    const data = await res.json();
    renderCards(data);

    metaEl.textContent = `Updated ${new Date().toLocaleTimeString()}`;
  } catch (e) {
    if (e.name === 'AbortError') return;
    console.error(e);
    showError(e.message || 'Network error');
    if (!cardsEl.querySelector('.metric-value')) {
      renderErrorState(e.message || 'Network error');
    }
    metaEl.textContent = '';
  } finally {
    cardsEl.querySelectorAll('.card').forEach(c => c.classList.remove('is-loading'));
    if (inflight === controller) inflight = null;
  }
}

/* If first load fails, replace skeletons with an in-grid error panel */
function renderErrorState(msg) {
  cardsEl.innerHTML = `
    <div class="col-12">
      <div class="card border-danger shadow-sm">
        <div class="card-body text-center py-5">
          <i class="bi bi-exclamation-triangle text-danger" style="font-size:2rem"></i>
          <div class="mt-2 fw-semibold">Could not load dashboard</div>
          <div class="text-muted small">${esc(msg)}</div>
          <button class="btn btn-sm btn-outline-danger mt-3" onclick="loadSummary()">Retry</button>
        </div>
      </div>
    </div>`;
}

/* ---------- Event wiring ---------- */
document.getElementById('reloadBtn').addEventListener('click', () => loadSummary());
document.getElementById('retryBtn').addEventListener('click', () => loadSummary());

document.getElementById('logoutLink').addEventListener('click', async (e) => {
  e.preventDefault();
  showOverlay('Signing out…');
  try {
    const res = await fetch('/auth/logout', {
      method: 'POST',
      headers: { 'Accept': 'application/json' },
      credentials: 'same-origin',   // ← ensure cookie is sent
    });
    const data = await res.json().catch(() => ({}));
    if (!res.ok || !data.ok) {
      hideOverlay();
      alert('Logout failed: ' + (data.error || 'Please try again.'));
      return;
    }
    window.location.href = '/auth/login?loggedout=1';
  } catch (err) {
    hideOverlay();
    alert('Logout failed: ' + (err.message || 'Network error.'));
  }
});

/* ---------- Init ---------- */
loadSummary();
</script>
</body>
</html>
