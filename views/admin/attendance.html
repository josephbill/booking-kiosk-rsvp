<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Attendance – Admin</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
<style>
  /* Table skeleton shimmer */
  .skeleton {
    display: inline-block;
    height: 1em;
    width: 100%;
    border-radius: 4px;
    background: linear-gradient(90deg, #e9ecef 25%, #f4f5f7 50%, #e9ecef 75%);
    background-size: 200% 100%;
    animation: shimmer 1.2s infinite;
  }
  @keyframes shimmer {
    0%   { background-position: 200% 0; }
    100% { background-position: -200% 0; }
  }

  /* Spinner inside button */
  .btn .spinner-border-sm { margin-right: .4rem; }

  /* Full-page request overlay (used for CSV downloads & page init) */
  .page-overlay {
    position: fixed; inset: 0;
    background: rgba(255,255,255,.72);
    backdrop-filter: blur(1px);
    display: flex; align-items: center; justify-content: center;
    z-index: 2000;
    opacity: 0; pointer-events: none;
    transition: opacity .15s ease-in-out;
  }
  .page-overlay.active { opacity: 1; pointer-events: auto; }

  /* Row-level fading during refresh */
  tbody.is-loading { opacity: .45; transition: opacity .15s; }

  /* Inline empty state */
  .empty-state { padding: 3rem 1rem; text-align: center; color: #6c757d; }
</style>
</head>
<body class="bg-light">
<nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
  <div class="container-fluid">
    <a class="navbar-brand" href="/admin/dashboard">RSVP Admin</a>
    <div class="navbar-nav">
      <a class="nav-link" href="/admin/dashboard">Dashboard</a>
      <a class="nav-link" href="/admin/invitations">Invitations</a>
      <a class="nav-link active" href="/admin/attendance">Attendance</a>
      <a class="nav-link" href="/admin/scanner/">Scanner</a>
    </div>
  </div>
</nav>

<div class="container pb-5">
  <div class="d-flex justify-content-between align-items-center mb-3">
    <h1 class="h3 mb-0">Attendance</h1>
    <button class="btn btn-outline-secondary btn-sm" id="reloadBtn" title="Refresh">
      <i class="bi bi-arrow-clockwise"></i> Refresh
    </button>
  </div>

  <!-- Export buttons -->
  <div class="mb-3 d-flex flex-wrap gap-2" id="exportBar">
    <a class="btn btn-outline-primary btn-sm export-btn" href="/admin/exports/register" data-label="Register CSV">
      <span class="btn-label">Register CSV</span>
    </a>
    <a class="btn btn-outline-primary btn-sm export-btn" href="/admin/exports/confirmed" data-label="Confirmed CSV">
      <span class="btn-label">Confirmed CSV</span>
    </a>
    <a class="btn btn-outline-primary btn-sm export-btn" href="/admin/exports/checkins" data-label="Check-ins CSV">
      <span class="btn-label">Check-ins CSV</span>
    </a>
    <a class="btn btn-outline-primary btn-sm export-btn" href="/admin/exports/declined-outstanding" data-label="Declined/Outstanding CSV">
      <span class="btn-label">Declined/Outstanding CSV</span>
    </a>
    <a class="btn btn-outline-primary btn-sm export-btn" href="/admin/exports/summary" data-label="Summary CSV">
      <span class="btn-label">Summary CSV</span>
    </a>
  </div>

  <!-- Error banner -->
  <div id="errorBanner" class="alert alert-danger d-none d-flex justify-content-between align-items-center">
    <span id="errorText">Something went wrong.</span>
    <button class="btn btn-sm btn-outline-danger" id="retryBtn">Retry</button>
  </div>

  <!-- Table -->
  <div class="table-responsive bg-white rounded shadow-sm">
    <table class="table table-sm mb-0">
      <thead class="table-light">
        <tr>
          <th>Name</th>
          <th>Email</th>
          <th>Status</th>
          <th>Party</th>
          <th>Checked In</th>
        </tr>
      </thead>
      <tbody id="rows"></tbody>
    </table>
  </div>

  <!-- Footer meta -->
  <div class="text-muted small mt-2" id="meta"></div>
</div>

<!-- Full-page overlay -->
<div class="page-overlay" id="pageOverlay" aria-hidden="true">
  <div class="text-center">
    <div class="spinner-border text-primary" role="status"></div>
    <div class="mt-2 small text-muted" id="overlayText">Working…</div>
  </div>
</div>

<script>
/* ---------- Utilities ---------- */
function esc(s) {
  return String(s ?? '').replace(/[&<>"']/g, c => ({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
  }[c]));
}

const overlay = document.getElementById('pageOverlay');
const overlayText = document.getElementById('overlayText');
function showOverlay(text = 'Working…') {
  overlayText.textContent = text;
  overlay.classList.add('active');
  overlay.setAttribute('aria-hidden', 'false');
}
function hideOverlay() {
  overlay.classList.remove('active');
  overlay.setAttribute('aria-hidden', 'true');
}

const tbody = document.getElementById('rows');
const metaEl = document.getElementById('meta');
const errorBanner = document.getElementById('errorBanner');
const errorText = document.getElementById('errorText');
function showError(msg) {
  errorText.textContent = msg;
  errorBanner.classList.remove('d-none');
}
function hideError() {
  errorBanner.classList.add('d-none');
}

/* ---------- Skeleton loader ---------- */
const SKELETON_ROWS = 6;
function renderSkeleton() {
  tbody.innerHTML = Array.from({ length: SKELETON_ROWS }).map(() => `
    <tr>
      <td><span class="skeleton" style="width:80%"></span></td>
      <td><span class="skeleton" style="width:90%"></span></td>
      <td><span class="skeleton" style="width:50%"></span></td>
      <td><span class="skeleton" style="width:30%"></span></td>
      <td><span class="skeleton" style="width:70%"></span></td>
    </tr>`).join('');
}

/* ---------- Empty & Error states ---------- */
function renderEmpty() {
  tbody.innerHTML = `
    <tr>
      <td colspan="5">
        <div class="empty-state">
          <i class="bi bi-inbox" style="font-size:2rem"></i>
          <div class="mt-2 fw-semibold">No invitations yet</div>
          <div class="small">Create invitations from the
            <a href="/admin/invitations">Invitations</a> page.
          </div>
        </div>
      </td>
    </tr>`;
}

function renderErrorRow(msg) {
  tbody.innerHTML = `
    <tr>
      <td colspan="5">
        <div class="empty-state text-danger">
          <i class="bi bi-exclamation-triangle" style="font-size:2rem"></i>
          <div class="mt-2 fw-semibold">Could not load attendance</div>
          <div class="small">${esc(msg)}</div>
          <button class="btn btn-sm btn-outline-danger mt-2" onclick="loadList()">Retry</button>
        </div>
      </td>
    </tr>`;
}

/* ---------- Main loader ---------- */
let inflight = null;

async function loadList({ silent = false } = {}) {
  if (inflight) { try { inflight.abort(); } catch (_) {} }
  const controller = new AbortController();
  inflight = controller;

  hideError();

  // First load: skeleton. Subsequent loads: fade existing rows.
  const hasRows = tbody.querySelector('tr') && !tbody.querySelector('.skeleton');
  if (!silent) {
    if (hasRows) tbody.classList.add('is-loading');
    else renderSkeleton();
  }

  try {
    const r = await fetch('/admin/api/invitations', {
      signal: controller.signal,
      headers: { 'Accept': 'application/json' },
    });

    if (r.status === 401) {
      showOverlay('Session expired — redirecting to login…');
      window.location.href = '/auth/login';
      return;
    }

    if (!r.ok) throw new Error(`Server returned ${r.status}`);

    const data = await r.json();
    const rows = data.invitations || [];

    if (rows.length === 0) {
      renderEmpty();
    } else {
      tbody.innerHTML = rows.map(i => `
        <tr>
          <td>${esc(i.invitee_name)}</td>
          <td>${esc(i.invitee_email)}</td>
          <td><span class="badge bg-${statusColor(i.rsvp_status)}">${esc(i.rsvp_status)}</span></td>
          <td>${i.confirmed_party_size ?? '-'}</td>
          <td>${i.checked_in_at ? new Date(i.checked_in_at).toLocaleString() : '-'}</td>
        </tr>`).join('');
    }

    metaEl.textContent = `${rows.length} invitation${rows.length === 1 ? '' : 's'} · updated ${new Date().toLocaleTimeString()}`;
  } catch (e) {
    if (e.name === 'AbortError') return;
    console.error(e);
    showError(e.message || 'Network error');
    renderErrorRow(e.message || 'Network error');
    metaEl.textContent = '';
  } finally {
    tbody.classList.remove('is-loading');
    if (inflight === controller) inflight = null;
  }
}

function statusColor(status) {
  return ({
    pending: 'warning',
    accepted: 'success',
    declined: 'danger',
    reopened: 'info',
  })[status] || 'secondary';
}

/* ---------- Export button loaders ---------- */
document.querySelectorAll('.export-btn').forEach(btn => {
  btn.addEventListener('click', (e) => {
    // If user modified-click / middle click, don't hijack
    if (e.metaKey || e.ctrlKey || e.shiftKey || e.altKey || e.button !== 0) return;
    e.preventDefault();

    const label = btn.dataset.label || 'CSV';
    const originalHTML = btn.innerHTML;

    // Disable all export buttons while one is in flight
    document.querySelectorAll('.export-btn').forEach(b => b.classList.add('disabled'));

    btn.innerHTML =
      `<span class="spinner-border spinner-border-sm" role="status"></span>
       <span class="btn-label">Preparing ${esc(label)}…</span>`;

    // Navigate after a tick so the spinner paints.
    // Downloads use Content-Disposition so the page won't unload.
    setTimeout(() => {
      const href = btn.getAttribute('href');
      // Use an invisible iframe so the page doesn't navigate
      const iframe = document.createElement('iframe');
      iframe.style.display = 'none';
      iframe.src = href;
      document.body.appendChild(iframe);

      // Reset after a reasonable time
      setTimeout(() => {
        iframe.remove();
        btn.innerHTML = originalHTML;
        document.querySelectorAll('.export-btn').forEach(b => b.classList.remove('disabled'));
      }, 1500);
    }, 60);
  });
});

/* ---------- Reload & retry ---------- */
document.getElementById('reloadBtn').addEventListener('click', () => loadList());
document.getElementById('retryBtn').addEventListener('click', () => loadList());

/* ---------- Init ---------- */
loadList();
</script>
</body>
</html>
